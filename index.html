<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RENTCAR · Inicia sesión</title>
  <meta name="description" content="Inicia sesión en RENTCAR Bogotá.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="login">
  <section class="login-visual" style="background-image: linear-gradient(rgba(18, 18, 17, 0.1), rgba(18, 18, 17, 0.88)), url('assets/img/login-hero.jpg');">
    <div class="brand"><span>R</span><div>RENTCAR<small>BOGOTÁ</small></div></div>
    <div class="login-message">
      <span class="overline">TU CIUDAD. TU RUTA.</span>
      <h1>Muévete<br>a tu manera.</h1>
      <p>Encuentra el carro perfecto y recíbelo donde estés.</p>
    </div>
    <p class="photo-credit">Bogotá, Colombia</p>
  </section>

  <section class="login-panel">
    <div class="login-box">
      <div class="login-mobile-brand"><div class="brand"><span>R</span><div>RENTCAR<small>BOGOTÁ</small></div></div></div>
      <span class="overline">BIENVENIDA DE NUEVO</span>
      <h2>Inicia sesión</h2>
      <p class="muted">Tu próximo viaje está a unos clics.</p>
      <form id="login-form">
        <label>Correo electrónico<input type="email" value="camila@email.com" required></label>
        <label>Contraseña<input type="password" value="rentcar2025" required></label>
        <div class="between">
          <label class="checkbox"><input type="checkbox" checked> Recordarme</label>
          <button class="link" type="button">¿Olvidaste tu contraseña?</button>
        </div>
        <button class="primary wide" type="submit">Ingresar <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 14 0m-5-5 5 5-5 5"></path></svg></button>
      </form>
      <p class="login-foot">¿Aún no tienes cuenta? <button class="link" type="button">Crear cuenta</button></p>
    </div>
  </section>
</main>

<script src="js/main.js"></script>
</body>
</html>
